<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Платформа для тестів</title>
<style>
:root{--bg:#f2f5f8;--card:#fff;--ink:#1b2733;--mute:#64727f;--line:#d6dee6;--acc:#1f6f8b;--ok:#2e7d4f;--bad:#b3402f;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#141b22;--card:#1c262f;--ink:#e6edf3;--mute:#93a1ad;--line:#2f3d49;--acc:#4fb0cf;--ok:#5cc38a;--bad:#ef7f6d;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;border-bottom:1px solid var(--line);background:var(--card)}
header b{font-size:18px}
main{max-width:760px;margin:0 auto;padding:20px}
h2{margin:8px 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.col{flex-direction:column;align-items:stretch}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row>input:not([type=radio]):not([type=checkbox]){flex:1;min-width:120px}
input,textarea,select,button{font:inherit;color:inherit}
input:not([type=radio]):not([type=checkbox]),textarea,select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
textarea{min-height:64px;resize:vertical}
button{padding:8px 16px;border:0;border-radius:6px;background:var(--acc);color:#fff;cursor:pointer;font-weight:600}
button.sec{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:400}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.tabs{display:flex;gap:8px;margin-bottom:16px}
.tabs button{background:transparent;color:var(--mute);border:1px solid var(--line)}
.tabs button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
code{background:var(--bg);padding:2px 8px;border-radius:4px;border:1px solid var(--line)}
small,.mute{color:var(--mute)}
.q{display:block;margin:6px 0}
.ok{color:var(--ok)}.bad{color:var(--bad)}
table{width:100%;border-collapse:collapse;background:var(--card)}
td,th{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left}
.score{font-size:40px;font-weight:700;margin:4px 0 16px}
.login{max-width:360px;margin:12vh auto}
#bar{position:fixed;top:0;left:0;right:0;height:3px;opacity:0;pointer-events:none;background:linear-gradient(90deg,transparent,var(--acc),transparent) no-repeat;background-size:40% 100%;animation:mv 1s linear infinite}
@keyframes mv{from{background-position:-40% 0}to{background-position:140% 0}}
@media(prefers-reduced-motion:reduce){#bar{animation:none;background:var(--acc)}}
button:disabled{opacity:.6;cursor:wait}
.pv{margin:2px 0;padding:6px 10px;border-left:3px solid var(--acc);color:var(--mute)}
.pv:empty{display:none}
.katex-display{overflow-x:auto;overflow-y:hidden}
</style>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/katex.min.css">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/katex.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/contrib/auto-render.min.js"></script>
</head>
<body>
<header><b>Тести</b><span id="who"></span></header>
<div id="bar"></div>
<main id="app"></main>
<script src="config.js"></script>
<script>

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let me = null, D = null, T = null, cur = null, tab = 'students', S = [], busy = 0;

// Формули LaTeX: $...$ у рядку, $$...$$ окремим рядком
function math(el) {
  if (window.renderMathInElement) renderMathInElement(el, {
    delimiters: [{ left: '$$', right: '$$', display: true }, { left: '\\[', right: '\\]', display: true },
                 { left: '\\(', right: '\\)', display: false }, { left: '$', right: '$', display: false }],
    throwOnError: false
  });
}
// після кожного оновлення #app автоматично відмальовуємо формули
(function () {
  const app = $('#app'), d = Object.getOwnPropertyDescriptor(Element.prototype, 'innerHTML');
  Object.defineProperty(app, 'innerHTML', { get() { return d.get.call(this); }, set(v) { d.set.call(this, v); math(this); } });
  window.addEventListener('load', () => math(app));
})();
function pv(i) { const el = $('#pv' + i); el.textContent = T.questions[i].text; math(el); }

function bar() { $('#bar').style.opacity = busy ? 1 : 0; }
async function api(action, p = {}) {
  let j;
  busy++; bar();
  try {
    const r = await fetch(API, { method: 'POST', body: JSON.stringify({ action, code: me && me.code, ...p }) });
    j = await r.json();
  } catch (e) {
    alert('Не вдалося зв\'язатися з сервером. Перевірте інтернет і налаштування доступу.');
    throw e;
  } finally { busy--; bar(); }
  if (j.error) { alert(j.error); throw new Error(j.error); }
  return j;
}

function loginView() {
  $('#who').innerHTML = '';
  $('#app').innerHTML = `<div class="login"><h2>Вхід</h2>
    <p class="mute">Введіть персональний код, який дав викладач.</p>
    <div class="row"><input id="code" placeholder="Код" autocomplete="off"><button onclick="login()">Увійти</button></div></div>`;
  $('#code').addEventListener('keydown', e => e.key === 'Enter' && login());
}

async function login(saved) {
  const code = saved || $('#code').value.trim();
  if (!code) return;
  me = { code };
  try {
    const j = await api('login');
    me.role = j.role; me.name = j.name;
    try { localStorage.setItem('code', code); } catch (e) {}
    $('#who').innerHTML = `${esc(j.name)} <button class="sec" onclick="logout()">Вийти</button>`;
    if (j.role === 'teacher') { D = j.data; T = null; renderT(); } else { S = j.data.tests; home(); }
  } catch (e) { me = null; try { localStorage.removeItem('code'); } catch (x) {} loginView(); }
}
function logout() { me = null; try { localStorage.removeItem('code'); } catch (e) {} loginView(); }

/* ---------- Учень ---------- */
function home() {
  const j = { tests: S };
  $('#app').innerHTML = '<h2>Мої тести</h2>' + (j.tests.length ? j.tests.map(t => `
    <div class="card"><div><b>${esc(t.title)}</b><br><small>${t.last ? 'Останній результат: ' + t.last.score + ' з ' + t.last.max : 'Ще не пройдено'}</small></div>
    <button onclick="start('${t.id}')">${t.last ? 'Пройти ще раз' : 'Почати'}</button></div>`).join('')
    : '<p class="mute">Поки що немає призначених тестів.</p>');
}

function qInput(q, i) {
  if (q.type === 'choice') return q.options.map((o, j) => `<label class="q"><input type="radio" name="q${i}" value="${j}"> ${esc(o)}</label>`).join('');
  if (q.type === 'multi') return '<small>Оберіть усі правильні варіанти</small>' + q.options.map((o, j) => `<label class="q"><input type="checkbox" name="q${i}" value="${j}"> ${esc(o)}</label>`).join('');
  if (q.type === 'number') return `<input id="a${i}" inputmode="decimal" autocomplete="off" placeholder="Число або дріб, напр. 3/4">`;
  if (q.type === 'match') return q.lefts.map((l, j) => `<div class="row"><span style="flex:1">${esc(l)}</span>
    <select id="m${i}_${j}" style="flex:1;width:auto"><option value="">—</option>${q.rights.map(r => `<option value="${esc(r)}">${esc(r).replace(/\$/g, '')}</option>`).join('')}</select></div>`).join('');
  return `<input id="a${i}" autocomplete="off" placeholder="Ваша відповідь">`;
}
function start(id) {
  cur = S.find(t => t.id == id);
  $('#app').innerHTML = `<h2>${esc(cur.title)}</h2>` + cur.questions.map((q, i) =>
    `<div class="card col"><b>${i + 1}. ${esc(q.text)}</b>${qInput(q, i)}</div>`).join('') +
    '<button id="sbtn" onclick="submitTest()">Надіслати відповіді</button>';
}

async function submitTest() {
  const answers = cur.questions.map((q, i) => {
    if (q.type === 'choice') { const c = document.querySelector(`input[name=q${i}]:checked`); return c ? +c.value : -1; }
    if (q.type === 'multi') return [...document.querySelectorAll(`input[name=q${i}]:checked`)].map(c => +c.value);
    if (q.type === 'match') return q.lefts.map((_, j) => $(`#m${i}_${j}`).value);
    return $('#a' + i).value;
  });
  const b = $('#sbtn'); b.disabled = true; b.textContent = 'Перевіряємо…';
  let j;
  try { j = await api('submit', { testId: cur.id, answers }); }
  catch (e) { b.disabled = false; b.textContent = 'Надіслати відповіді'; return; }
  const s = S.find(t => t.id == cur.id); if (s) s.last = { score: j.score, max: j.max };
  $('#app').innerHTML = `<h2>${esc(cur.title)}</h2><div class="score">${j.score} з ${j.max}</div>` +
    cur.questions.map((q, i) => `<div class="card col"><b>${i + 1}. ${esc(q.text)}</b>
      ${j.review[i].ok ? '<span class="ok">Правильно</span>' : `<span class="bad">Неправильно.</span> <span>Правильна відповідь: ${esc(j.review[i].correct)}</span>`}</div>`).join('') +
    '<button onclick="home()">До моїх тестів</button>';
}

/* ---------- Викладач ---------- */
async function teacher() { D = await api('all'); T = null; renderT(); }

function renderT() {
  if (T) return editor();
  $('#app').innerHTML = `<div class="tabs">${[['students', 'Учні'], ['tests', 'Тести'], ['results', 'Результати']]
    .map(([k, n]) => `<button class="${tab === k ? 'on' : ''}" onclick="tab='${k}';renderT()">${n}</button>`).join('')}</div>` +
    ({ students: tStudents, tests: tTests, results: tResults })[tab]();
}

function tStudents() {
  return `<div class="row" style="margin-bottom:12px"><input id="ns" placeholder="Ім'я нового учня"><button onclick="addSt()">Додати учня</button></div>` +
    (D.students.map(s => `<div class="card col"><div class="row"><b>${esc(s.name)}</b><span class="mute">код:</span><code>${esc(s.code)}</code>
      <button class="sec" style="margin-left:auto" onclick="delSt('${s.id}')">Видалити</button></div>
      <div class="row">${D.tests.length ? D.tests.map(t => `<label><input type="checkbox" ${D.assign.some(a => a.studentId == s.id && a.testId == t.id) ? 'checked' : ''}
        onchange="asg('${s.id}','${t.id}',this.checked)"> ${esc(t.title)}</label>`).join('') : '<small>Спочатку створіть тест на вкладці «Тести»</small>'}</div></div>`).join('') || '<p class="mute">Додайте першого учня.</p>');
}
async function addSt() { const n = $('#ns').value.trim(); if (!n) return; const j = await api('addStudent', { name: n }); D.students.push(j.student); renderT(); }
async function delSt(id) { if (!confirm('Видалити учня?')) return;
  D.students = D.students.filter(s => s.id != id); D.assign = D.assign.filter(a => a.studentId != id);
  renderT(); api('delStudent', { id }).catch(teacher);
}
async function asg(studentId, testId, on) {
  D.assign = D.assign.filter(a => !(a.studentId == studentId && a.testId == testId));
  if (on) D.assign.push({ studentId, testId });
  api('assign', { studentId, testId, on }).catch(teacher);
}

function tTests() {
  return `<button onclick="newTest()" style="margin-bottom:12px">Створити тест</button>` +
    (D.tests.map(t => `<div class="card"><div><b>${esc(t.title)}</b><br><small>Питань: ${t.questions.length}</small></div>
      <div class="row"><button class="sec" onclick="editTest('${t.id}')">Редагувати</button><button class="sec" onclick="delTest('${t.id}')">Видалити</button></div></div>`).join('') || '<p class="mute">Тестів ще немає.</p>');
}
function newTest() { T = { title: '', questions: [] }; addQ(); }
function editTest(id) { T = JSON.parse(JSON.stringify(D.tests.find(t => t.id == id))); renderT(); }
async function delTest(id) { if (!confirm('Видалити тест?')) return;
  D.tests = D.tests.filter(t => t.id != id); D.assign = D.assign.filter(a => a.testId != id);
  renderT(); api('delTest', { id }).catch(teacher);
}

const TYPES = [['choice', 'Одна правильна відповідь'], ['multi', 'Кілька правильних відповідей'], ['text', 'Коротка відповідь (текст)'],
  ['number', 'Числова відповідь'], ['match', 'Відповідність']];
function newQ() { return { type: 'choice', text: '', options: ['', ''], correct: 0, accept: [], value: '', tol: '0', pairs: [{ left: '', right: '' }, { left: '', right: '' }] }; }
function addQ() { T.questions.push(newQ()); renderT(); }
function setType(i, t) {
  const q = Object.assign(newQ(), T.questions[i]);
  if (t === 'multi' && !Array.isArray(q.correct)) q.correct = [q.correct || 0];
  if (t === 'choice' && Array.isArray(q.correct)) q.correct = q.correct[0] || 0;
  q.type = t; T.questions[i] = q; editor();
}
function toggleCorrect(i, j, on) {
  const c = T.questions[i].correct.filter(x => x != j);
  if (on) c.push(j);
  T.questions[i].correct = c;
}
function delOpt(i, j) {
  const q = T.questions[i]; q.options.splice(j, 1);
  if (q.type === 'multi') q.correct = q.correct.filter(c => c != j).map(c => c > j ? c - 1 : c);
  else q.correct = q.correct == j ? 0 : (q.correct > j ? q.correct - 1 : q.correct);
  editor();
}
function qFields(q, i) {
  const Q = `T.questions[${i}]`;
  if (q.type === 'choice' || q.type === 'multi') {
    const multi = q.type === 'multi';
    return `<small>${multi ? 'Позначте всі правильні варіанти:' : 'Позначте правильний варіант:'}</small>` + q.options.map((o, j) => `<div class="row">
      ${multi ? `<input type="checkbox" ${q.correct.includes(j) ? 'checked' : ''} onchange="toggleCorrect(${i},${j},this.checked)">`
              : `<input type="radio" name="c${i}" ${q.correct == j ? 'checked' : ''} onchange="${Q}.correct=${j}">`}
      <input value="${esc(o)}" placeholder="Варіант ${j + 1}" oninput="${Q}.options[${j}]=this.value">
      <button class="sec" onclick="delOpt(${i},${j})" title="Видалити варіант">✕</button></div>`).join('') +
      `<div><button class="sec" onclick="${Q}.options.push('');editor()">Додати варіант</button></div>`;
  }
  if (q.type === 'number') return `<div class="row"><label style="flex:2">Правильна відповідь<input value="${esc(q.value)}" placeholder="напр. 2,5 або 3/4" oninput="${Q}.value=this.value"></label>
    <label style="flex:1">Допуск (±)<input value="${esc(q.tol)}" placeholder="0" oninput="${Q}.tol=this.value"></label></div>
    <small>Учень може писати десяткові з комою чи крапкою та дроби (3/4). Допуск потрібен, якщо відповідь можна округлити.</small>`;
  if (q.type === 'match') return '<small>Пари: ліворуч і праворуч мають збігатися. Учень бачить праві частини в перемішаному порядку.</small>' +
    q.pairs.map((p, j) => `<div class="row"><input value="${esc(p.left)}" placeholder="Ліва частина" oninput="${Q}.pairs[${j}].left=this.value">
      <input value="${esc(p.right)}" placeholder="Права частина" oninput="${Q}.pairs[${j}].right=this.value">
      <button class="sec" onclick="${Q}.pairs.splice(${j},1);editor()" title="Видалити пару">✕</button></div>`).join('') +
    `<div><button class="sec" onclick="${Q}.pairs.push({left:'',right:''});editor()">Додати пару</button></div>`;
  return `<input placeholder="Правильні відповіді через «;»" value="${esc((q.accept || []).join('; '))}"
    oninput="${Q}.accept=this.value.split(';').map(s=>s.trim()).filter(Boolean)">`;
}
function editor() {
  $('#app').innerHTML = `<h2>${T.id ? 'Редагування тесту' : 'Новий тест'}</h2>
    <input placeholder="Назва тесту" value="${esc(T.title)}" oninput="T.title=this.value" style="margin-bottom:8px">
    <p class="mute" style="margin:0 0 12px">Формули: <code>$x^2+1$</code> у тексті, <code>$$\\frac{a}{b}$$</code> окремим рядком. Працює в питаннях і варіантах відповіді.</p>` +
    T.questions.map((q, i) => `<div class="card col">
      <div class="row"><select style="width:auto" onchange="setType(${i},this.value)">${TYPES.map(([k, n]) => `<option value="${k}" ${q.type == k ? 'selected' : ''}>${n}</option>`).join('')}</select>
        <span class="mute">Питання ${i + 1}</span><button class="sec" style="margin-left:auto" onclick="T.questions.splice(${i},1);editor()">Видалити питання</button></div>
      <textarea placeholder="Текст питання" oninput="T.questions[${i}].text=this.value;pv(${i})">${esc(q.text)}</textarea><div class="pv" id="pv${i}">${esc(q.text)}</div>
      ${qFields(q, i)}</div>`).join('') +
    `<div class="row"><button class="sec" onclick="addQ()">Додати питання</button><button onclick="saveTest()">Зберегти тест</button><button class="sec" onclick="T=null;renderT()">Скасувати</button></div>`;
}
async function saveTest() {
  if (!T.title.trim()) return alert('Введіть назву тесту');
  if (saveTest.busy) return;
  saveTest.busy = true;
  try {
    const j = await api('saveTest', { test: T });
    T.id = T.id || j.id;
    const i = D.tests.findIndex(t => t.id == T.id);
    if (i < 0) D.tests.push(T); else D.tests[i] = T;
    T = null; renderT();
  } finally { saveTest.busy = false; }
}

function tResults() {
  const nm = id => (D.students.find(s => s.id == id) || {}).name || '—';
  const tt = id => (D.tests.find(t => t.id == id) || {}).title || '—';
  const rs = D.results.slice().reverse();
  return rs.length ? `<div style="overflow-x:auto"><table><tr><th>Учень</th><th>Тест</th><th>Бал</th><th>Дата</th></tr>` +
    rs.map(r => `<tr><td>${esc(nm(r.studentId))}</td><td>${esc(tt(r.testId))}</td><td>${r.score} з ${r.max}</td><td>${new Date(r.date).toLocaleString('uk')}</td></tr>`).join('') + '</table></div>'
    : '<p class="mute">Результатів ще немає.</p>';
}

/* ---------- Старт ---------- */
(function () { let c = null; try { c = localStorage.getItem('code'); } catch (e) {} c ? login(c) : loginView(); })();
</script>
</body>
</html>
